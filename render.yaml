services:
  - type: web
    name: medinest-backend
    env: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: node backend/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLERK_SECRET_KEY
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: VITE_RAZORPAY_KEY_ID
        sync: false
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: 3306
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        value: medinest_db
      - key: MONGODB_URI
        sync: false
      - key: APP_URL
        sync: false
      - key: VITE_API_BASE_URL
        sync: false
      - key: ADMIN_SECRET_KEY
        sync: false
